name: royal_lms
description: Royal LMS - A secure Learning Management System Flutter Application with Firebase backend, YouTube secure video player, view limits, device binding, and watch history analytics.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Design System
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0

  # Firebase Suite
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8
  cloud_firestore: ^4.15.8

  # Device & Security
  device_info_plus: ^10.1.0
  flutter_secure_storage: ^9.0.0
  screen_protector: ^1.4.1
  uuid: ^4.3.3

  # Video Streaming & Webview
  youtube_player_flutter: ^9.0.1
  pointer_interceptor: ^0.9.3+4

dependency_overrides:
  flutter_inappwebview: ^6.0.0

  # State Management & Helpers
  provider: ^6.1.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
